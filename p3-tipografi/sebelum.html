<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum 10 - Tipografi (Sebelum)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .judul-besar { font-size: 3rem; font-weight: 300; text-align: center; }
    .pembuka { font-size: 1.25rem; color: #6c757d; text-align: center; }
    .label { text-transform: uppercase; font-weight: 700; letter-spacing: .05em; }
    .catatan { font-size: .875em; font-style: italic; }
    .nim { font-family: monospace; }
  </style>
</head>
<body>
  <main class="container py-5">
    <h1 class="judul-besar">Selamat Datang di SIAKAD Mini</h1>
    <p class="pembuka">Sistem informasi akademik Program Studi Teknik Informatika.</p>
    <h2 class="h4">Profil Mahasiswa</h2>
    <p class="label">Nama</p>
    <p>Muhammad Alvin Abrar</p>
    <p class="label">NPM</p>
    <p class="nim">2510010248</p>
    <p class="catatan">Data diperbarui otomatis setiap awal semester.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
